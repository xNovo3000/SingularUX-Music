[versions]
agp = "9.2.0"
baseline = "1.5.0-alpha05"
hilt = "2.59.2"
androidx-core = "1.18.0"
androidx-core-splashscreen = "1.2.0"
androidx-activity = "1.13.0"
androidx-fragment = "1.8.9"
androidx-profileinstaller = "1.4.1"
androidx-recyclerview = "1.4.0"
google-material = "1.13.0"
lifecycle = "2.10.0"
lombok = "1.18.46"
media3 = "1.10.0"
navigation = "2.9.8"
#noinspection NewerVersionAvailable 2.71828 is not a version
picasso = "2.8"
rxjava = "3.1.12"
test-junit = "1.3.0"
test-espresso = "3.7.0"
test-uiautomator = "2.3.0"
junit = "4.13.2"
appcompat = "1.6.1"

[libraries]
# AndroidX
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx-core" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "androidx-activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidx-fragment" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidx-recyclerview" }
# Material 3
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }
# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# AndroidX - Lifecycle
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
lifecycle-reactivestreams = { group = "androidx.lifecycle", name = "lifecycle-reactivestreams", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
# Lombok
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
# AndroidX - Media3
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# AndroidX - Navigation
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
# Picasso
picasso = { group = "com.squareup.picasso", name = "picasso", version.ref = "picasso" }
# RxJava
rxjava = { group = "io.reactivex.rxjava3", name = "rxjava", version.ref = "rxjava" }
rxjava-android = { group = "io.reactivex.rxjava3", name = "rxandroid", version = "3.0.2" }
# Test
test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "test-espresso" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "test-junit" }
test-macrobenchmark = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baseline" }
test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "test-uiautomator" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baseline" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
